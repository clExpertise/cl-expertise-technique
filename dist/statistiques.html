<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090e34"><title>Statistiques privées | CL Expertise Technique</title><link rel="stylesheet" href="styles.css"></head><body class="stats-body">
<main class="stats-shell"><header class="stats-header"><a href="index.html"><img src="assets/logo-cl-expertise.png" alt="CL Expertise Technique"></a><div><p class="eyebrow">Espace privé</p><h1>Audience du site</h1><p>Statistiques agrégées, sans publicité ni profilage.</p></div></header>
<section class="stats-login" id="stats-login"><label>Clé administrateur<input id="stats-token" type="password" autocomplete="current-password" placeholder="Saisissez votre clé privée"></label><label>Période<select id="stats-days"><option value="7">7 jours</option><option value="30" selected>30 jours</option><option value="90">90 jours</option><option value="365">1 an</option></select></label><button class="button primary" id="stats-load" type="button">Afficher les statistiques</button><p id="stats-status" role="status"></p></section>
<section id="stats-content" hidden><div class="stats-kpis"><article><span>Pages vues</span><strong id="total-views">0</strong></article><article><span>Visiteurs uniques estimés</span><strong id="total-visitors">0</strong></article><article><span>Pages suivies</span><strong id="total-pages">0</strong></article></div><div class="stats-grid"><section><h2>Évolution quotidienne</h2><div class="daily-chart" id="daily-chart"></div></section><section><h2>Pages les plus consultées</h2><div class="stats-table-wrap"><table><thead><tr><th>Page</th><th>Vues</th><th>Visiteurs</th></tr></thead><tbody id="pages-table"></tbody></table></div></section></div></section>
</main><script src="site-config.js"></script><script src="analytics-admin.js"></script></body></html>
