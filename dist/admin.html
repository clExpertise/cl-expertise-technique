<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Tickets · CL Expertise Technique</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{padding:24px}.admin-shell{max-width:1200px;margin:auto}.admin-head,.admin-tools{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}.admin-tools{padding:1rem 0 2rem}.admin-tools input,.admin-tools select,.admin-login input{background:#071b2e;color:#fff;border:1px solid var(--line);padding:.75rem}.admin-tools button,.admin-login button{background:var(--cyan);color:#031623;border:0;padding:.78rem 1rem;font-weight:700}.ticket-list{display:grid;gap:1rem}.ticket{border:1px solid var(--line);background:#081d31;padding:1rem}.ticket summary{cursor:pointer;display:grid;grid-template-columns:180px 1fr 120px 100px;gap:1rem;align-items:center}.ticket small{color:var(--muted)}.ticket-body{padding-top:1rem;border-top:1px solid var(--line);margin-top:1rem}.ticket-body pre{white-space:pre-wrap;background:#041421;padding:1rem;color:#bcd0dc}.ticket-actions{display:flex;gap:.5rem;flex-wrap:wrap}.ticket-actions button{border:1px solid var(--line);background:transparent;color:#fff;padding:.5rem}.ticket-actions .delete{color:#ff8797}.admin-login{max-width:440px;margin:15vh auto;display:grid;gap:1rem;padding:2rem;border:1px solid var(--line);background:#081d31}@media(max-width:700px){.ticket summary{grid-template-columns:1fr}.admin-head{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="admin-shell">
    <form class="admin-login" id="admin-login">
      <h1>Administration</h1><p>Le jeton reste uniquement dans cette session de navigateur.</p>
      <label>Jeton administrateur<input id="admin-token" type="password" autocomplete="current-password" required></label>
      <button>Ouvrir les tickets</button><p id="login-status" role="status"></p>
    </form>
    <section id="admin-content" hidden>
      <div class="admin-head"><div><p class="eyebrow">Support CL</p><h1>Tickets</h1></div><a href="index.html">Retour au site</a></div>
      <div class="admin-tools"><input id="ticket-search" placeholder="Numéro, nom ou e-mail"><select id="ticket-filter"><option value="">Tous les statuts</option><option value="OPEN">Ouverts</option><option value="IN_PROGRESS">En cours</option><option value="RESOLVED">Résolus</option></select><button id="refresh" type="button">Actualiser</button></div>
      <div class="ticket-list" id="ticket-list"></div>
    </section>
  </main>
  <script src="config.js"></script><script src="admin.js"></script>
</body>
</html>
